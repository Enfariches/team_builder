version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: internal/user/sqlc/queries.sql
    gen:
      go:
        package: userdb
        out: internal/user/sqlc/db
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
  - engine: postgresql
    schema: migrations
    queries: internal/auth/sqlc/queries.sql
