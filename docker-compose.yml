services:
  # PostgreSQL 16. Креды дефолтные, только для локальной разработки.
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    # Порт наружу для запуска API и тестов вне Docker (см. .env.example)
    ports: ["5432:5432"]
    # Миграции и API ждут, пока БД начнёт принимать соединения
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Одноразовая задача: накатывает goose-миграции из backend/migrations и выходит
  migrate:
    build: { context: ., dockerfile: backend/Dockerfile, target: migrate }
    command: ["postgres://postgres:postgres@db:5432/postgres?sslmode=disable", "up"]
    depends_on:
      db: { condition: service_healthy }

  # HTTP API на http://localhost:8080/api/v1
  api:
    build: { context: ., dockerfile: backend/Dockerfile, target: api }
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/postgres?sslmode=disable
      # Подпись JWT, минимум 32 байта. Для продакшена переопределить через env
      JWT_SECRET: ${JWT_SECRET:-dev-secret-dev-secret-dev-secret-dev}
      PORT: "8080"
      # local и test отключают Secure у refresh-cookie (стенд работает по http)
      APP_ENV: ${APP_ENV:-local}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      # debug включает запись о каждом запросе (метод, путь, статус, время)
      LOG_LEVEL: ${LOG_LEVEL:-debug}
    ports: ["8080:8080"]
    # Стартует только после успешных миграций
    depends_on:
      migrate: { condition: service_completed_successfully }
